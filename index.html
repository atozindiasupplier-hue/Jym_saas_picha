<!DOCTYPE html>
<html lang="hi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uttam Horizon - Gym SaaS Official Pitch & Pricing Blueprint</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emeraldDark: '#062016',
                        emeraldCard: '#0d3022',
                        emeraldAccent: '#10b981',
                        goldPrimary: '#f59e0b',
                        goldHover: '#d97706',
                        goldLight: '#fef3c7',
                        goldText: '#fbbf24'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Web & Glassmorphism Styling */
        body {
            background-color: #04120c;
            color: #ecfdf5;
            font-family: 'Inter', sans-serif;
        }

        .gold-gradient-text {
            background: linear-gradient(135deg, #fef3c7 0%, #f59e0b 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-border-glow {
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.1);
        }

        .emerald-glass {
            background: rgba(13, 48, 34, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* PRINT STYLING CONFIGURATION (@media print) */
        @media print {
            @page {
                size: A4 portrait;
                margin: 12mm;
            }

            body {
                background: #ffffff !important;
                color: #0f172a !important;
                font-size: 11pt;
            }

            .no-print {
                display: none !important;
            }

            .print-only {
                display: block !important;
            }

            .print-container {
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .print-card {
                background: #ffffff !important;
                border: 1.5px solid #cbd5e1 !important;
                color: #0f172a !important;
                box-shadow: none !important;
                page-break-inside: avoid;
                border-radius: 8px !important;
            }

            .print-gold-text {
                color: #b45309 !important;
                -webkit-text-fill-color: #b45309 !important;
                background: none !important;
            }

            .print-badge {
                background-color: #f1f5f9 !important;
                color: #0f172a !important;
                border: 1px solid #94a3b8 !important;
            }

            .print-highlight {
                background-color: #fef3c7 !important;
                border: 1px solid #f59e0b !important;
            }

            .print-emerald-badge {
                background-color: #ecfdf5 !important;
                color: #047857 !important;
                border: 1px solid #10b981 !important;
            }

            .page-break {
                page-break-before: always;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- TOP NAVIGATION / ACTION BAR (Hidden on Print) -->
    <header class="no-print sticky top-0 z-50 bg-emeraldDark/90 backdrop-blur-md border-b border-emerald-800/40 px-4 py-3 sm:px-8">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-goldPrimary to-amber-600 flex items-center justify-center text-slate-950 font-extrabold text-xl shadow-lg">
                    UH
                </div>
                <div>
                    <h1 class="font-heading font-extrabold text-lg text-white tracking-wide">UTTAM HORIZON</h1>
                    <p class="text-xs text-emerald-400 font-medium">Official Pitch Proposal & Pricing Draft</p>
                </div>
            </div>

            <!-- Controls: View Tabs & Print Button -->
            <div class="flex items-center gap-2 sm:gap-4 flex-wrap justify-center">
                <!-- Filter Tabs -->
                <div class="bg-emeraldCard p-1 rounded-xl flex border border-emerald-700/40 text-xs sm:text-sm">
                    <button onclick="switchTab('all')" id="tab-all" class="px-3 py-1.5 rounded-lg font-semibold transition-all bg-goldPrimary text-slate-950 shadow">
                        All Plans
                    </button>
                    <button onclick="switchTab('lifetime')" id="tab-lifetime" class="px-3 py-1.5 rounded-lg font-semibold text-emerald-300 hover:text-white transition-all">
                        Lifetime
                    </button>
                    <button onclick="switchTab('monthly')" id="tab-monthly" class="px-3 py-1.5 rounded-lg font-semibold text-emerald-300 hover:text-white transition-all">
                        Monthly Rent
                    </button>
                </div>

                <!-- Print Action Button -->
                <button onclick="window.print()" class="bg-gradient-to-r from-goldPrimary to-amber-500 hover:from-amber-500 hover:to-goldPrimary text-slate-950 font-bold px-4 py-2 rounded-xl text-sm flex items-center gap-2 shadow-lg shadow-goldPrimary/20 transition-all transform active:scale-95">
                    <i class="fa-solid fa-print text-base"></i>
                    <span>Print / Export PDF</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN PROPOSAL CONTENT CONTAINER -->
    <main class="print-container max-w-7xl mx-auto px-4 py-6 sm:px-8 sm:py-10 flex-grow w-full">

        <!-- BRANDING HEADER SECTION -->
        <section class="mb-10 text-center sm:text-left border-b border-emerald-800/40 pb-8 print:pb-4 print:mb-6 print:border-slate-300">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-950/80 border border-emerald-500/30 text-emerald-400 text-xs font-semibold mb-3 print-emerald-badge">
                        <i class="fa-solid fa-shield-halved text-goldText"></i> Enterprise Zero-Trust Architecture
                    </div>
                    <h1 class="font-heading font-black text-3xl sm:text-5xl tracking-tight text-white mb-2 print-gold-text">
                        UTTAM HORIZON
                    </h1>
                    <p class="text-goldText font-bold text-lg sm:text-xl tracking-wide print:text-slate-800">
                        NEXT-GEN GYM AUTOMATION & MANAGEMENT SAAS
                    </p>
                </div>
                <div class="text-left sm:text-right text-xs text-emerald-300/80 space-y-1 print:text-slate-600">
                    <p><i class="fa-solid fa-file-contract
